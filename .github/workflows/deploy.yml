on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: deploy2nekoweb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # NOTE: the sidebar build step (python3 build_site.py) must be run
      # locally before pushing; this workflow deploys public/ as-is.
      # your build step here
        
      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: 'michael.nekoweb.org'
          nekoweb-username: 'michael'
          directory: 'public'